[project]
name = "ghostline"
version = "0.5.0"
description = "LLM-fueled AI-powered vishing operative for authorized security assessments"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Shrewd" }]
requires-python = ">=3.12,<3.13"
keywords = ["security", "red-team", "vishing", "social-engineering", "ai", "agents"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
  "Operating System :: OS Independent",
  "Intended Audience :: Information Technology",
]

dependencies = [
  # ── Async web stack ───────────────────────────────────────────────
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "aiohttp>=3.10.0",
  "httpx>=0.27.0",

  # ── AI / Agents ──────────────────────────────────────────────────
  "openai-agents>=0.18.0",
  "litellm>=1.50.0",

  # ── Pydantic / settings ──────────────────────────────────────────
  "pydantic>=2.9.0",
  "pydantic-settings>=2.5.0",
  "python-dotenv>=1.0.1",

  # ── Persistence ──────────────────────────────────────────────────
  "aiosqlite>=0.20.0",

  # ── Media / DSP ──────────────────────────────────────────────────
  "numpy>=1.26.4",
  "scipy>=1.13.0",
  "pydub>=0.25.1",

  # ── Telephony & tunneling ────────────────────────────────────────
  "twilio>=9.3.0",
  "pyngrok>=7.2.0",

  # ── Misc ─────────────────────────────────────────────────────────
  "pyyaml>=6.0",
  "certifi>=2024.8.30",
  "typer>=0.12.5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "pytest-cov>=5.0.0",
  "pytest-mock>=3.14.0",
  "respx>=0.21.1",
  "aioresponses>=0.7.6",
  "httpx-ws>=0.7.0",
  "ruff>=0.7.0",
  "mypy>=1.13.0",
  "types-pyyaml>=6.0.12",
  "pre-commit>=4.0.0",
]

[project.scripts]
ghostline = "ghostline.cli:app"

[project.urls]
Homepage = "https://github.com/ads/GhostLine"
Repository = "https://github.com/ads/GhostLine"

# ──────────────────────────────────────────────────────────────────
# Build system (src layout)
# ──────────────────────────────────────────────────────────────────
[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ghostline"]

# ──────────────────────────────────────────────────────────────────
# Ruff: lint + format
# ──────────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["playbooks", "assets", "legacy"]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "B",   # bugbear
  "UP",  # pyupgrade
  "SIM", # simplify
  "C4",  # comprehensions
  "PIE",
  "RET",
  "ERA", # dead code
  "PL",  # pylint
  "RUF",
  "S",   # bandit security
  "ASYNC",
  "TID",
  "PT",  # pytest style
  "C90", # mccabe complexity
  "N",   # pep8-naming
  "D",   # pydocstyle
]
ignore = [
  "D100", "D104", "D105", "D107", # missing docstring rules
  "PLR0913", # too many args (acceptable for DI)
  "S101",    # asserts in tests
  "S104",    # binding to 0.0.0.0 (intended for serve)
  "S603",    # subprocess.run - audited usage
  "S607",    # partial executable path
  "E501",    # line length handled by formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PLR2004", "D"]
"scripts/**" = ["S", "D"]
"src/ghostline/__main__.py" = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.pylint]
max-args = 8

[tool.ruff.lint.isort]
known-first-party = ["ghostline"]

# ──────────────────────────────────────────────────────────────────
# Mypy: strict typing
# ──────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unreachable = true
warn_redundant_casts = true
warn_unused_configs = true
no_implicit_reexport = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_any_generics = true
files = ["src/ghostline"]

[[tool.mypy.overrides]]
module = ["pydub.*", "scipy.*", "twilio.*", "pyngrok.*"]
ignore_missing_imports = true

# ──────────────────────────────────────────────────────────────────
# Pytest
# ──────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
minversion = "8.3"
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = [
  "-ra",
  "--strict-markers",
  "--strict-config",
  "-m", "not live",
  "--cov=ghostline",
  "--cov-report=term-missing",
  "--cov-report=html",
]
markers = [
  "live: tests that hit real Twilio/Deepgram/ElevenLabs (skip by default)",
  "slow: long-running tests",
]
filterwarnings = [
  "error",
  "ignore::DeprecationWarning:pydub.*",
  "ignore::DeprecationWarning:pyngrok.*",
  "ignore::SyntaxWarning:pydub.*",
  "ignore::SyntaxWarning",
]

[tool.coverage.run]
source = ["src/ghostline"]
branch = true
omit = ["*/tests/*", "*/__main__.py"]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
]
